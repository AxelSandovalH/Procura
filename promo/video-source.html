<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Procura — video</title>
<style>
:root{--bg:#fff;--fg:#0a0a0a;--bd:#e5e5e5;--mut:#f5f5f5;--mfg:#737373;--ok:#047857;--okb:#ecfdf5;--warn:#92400e;--warnb:#fffbeb;--info:#1d4ed8;--infob:#eff6ff;--bad:#b91c1c;--badb:#fef2f2}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;background:transparent;overflow:hidden;font-family:"Inter","Helvetica Neue",Helvetica,Arial,sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0}
.scene{position:absolute;inset:0;opacity:0;will-change:opacity,transform}
.head{position:absolute;left:0;right:0;top:78px;text-align:center}
.eyebrow{font-size:26px;letter-spacing:.22em;text-transform:uppercase;color:#8a8a8f;font-weight:500}
.title{font-family:"Inter Display","Inter",sans-serif;font-size:92px;font-weight:600;letter-spacing:-.035em;line-height:1.02;margin-top:14px}
.sub{font-size:30px;color:#a1a1a6;margin:20px auto 0;max-width:1180px;line-height:1.35;font-weight:400}
.grad{background:linear-gradient(90deg,#fff,#9aa0ff 60%,#7dd3fc);-webkit-background-clip:text;color:transparent}
/* ventana de la app */
.win{position:absolute;left:180px;top:385px;width:1560px;height:900px;border-radius:22px;background:var(--bg);color:var(--fg);overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.12),0 60px 140px rgba(0,0,0,.65),0 0 220px rgba(110,120,255,.18);transform-origin:50% 0}
.chrome{height:40px;background:#f3f3f3;border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 16px;gap:8px}
.dot{width:12px;height:12px;border-radius:50%;background:#d4d4d4}.chrome .url{margin:0 auto;font-size:13px;color:#8a8a8a;background:#fff;border:1px solid var(--bd);border-radius:8px;padding:4px 80px}
.app{display:flex;height:860px}
.side{width:226px;background:#fafafa;border-right:1px solid var(--bd);padding:16px 12px;display:flex;flex-direction:column;gap:2px;flex:none}
.logo{display:flex;align-items:center;gap:8px;padding:4px 8px 16px;font-weight:600;font-size:19px;letter-spacing:-.02em}
.logo svg{height:22px;width:auto}
.mod{display:flex;align-items:center;gap:10px;padding:0 10px;border-radius:9px;font-size:14px;color:#404040;flex:1;max-height:54px}
.mod svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mod.on{background:#ececec;color:#0a0a0a;font-weight:600}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:56px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-size:14px;color:var(--mfg)}
.org{display:flex;align-items:center;gap:10px;color:var(--fg);font-weight:500}.av{width:30px;height:30px;border-radius:50%;background:#171717;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:600}
.tabs{display:flex;gap:4px;padding:10px 28px 0;border-bottom:1px solid var(--bd);font-size:14px}
.tab{padding:8px 12px;margin-bottom:-1px;border-bottom:2px solid transparent;color:var(--mfg);white-space:nowrap}.tab.on{border-color:#0a0a0a;color:#0a0a0a;font-weight:600}
.page{padding:24px 28px;flex:1;min-height:0;position:relative;overflow:hidden}
.ph{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}.ph h2{font-size:26px;font-weight:600;letter-spacing:-.02em}.ph p{font-size:14px;color:var(--mfg);margin-top:4px}
.btn{height:36px;padding:0 14px;border-radius:9px;border:1px solid var(--bd);background:#fff;font-size:13.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;color:#0a0a0a}.btn.p{background:#171717;color:#fff;border-color:#171717}.btn.sm{height:30px;padding:0 11px;font-size:13px}
.card{border:1px solid var(--bd);border-radius:14px;background:#fff}
.badge{display:inline-flex;height:21px;align-items:center;border-radius:99px;padding:0 9px;font-size:12px;font-weight:500;white-space:nowrap}
.b-ok{background:var(--okb);color:var(--ok)}.b-warn{background:var(--warnb);color:var(--warn)}.b-info{background:var(--infob);color:var(--info)}.b-mut{background:var(--mut);color:var(--mfg)}.b-bad{background:var(--badb);color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:14px}th{font-weight:500;color:var(--mfg);text-align:left;padding:11px 14px;border-bottom:1px solid var(--bd);white-space:nowrap;font-size:13px}td{padding:12px 14px;border-bottom:1px solid #eee;vertical-align:top}tr:last-child td{border-bottom:0}
.r{text-align:right}.tn{font-variant-numeric:tabular-nums}.mono{font-family:ui-monospace,Menlo,monospace}.mf{color:var(--mfg)}.xs{font-size:12px}
.best{background:#ecfdf5;transition:none}
.pill{border:1px solid var(--bd);border-radius:9px;padding:4px 9px;font-size:12px;display:inline-flex;gap:7px;align-items:center}
.toast{position:absolute;right:28px;bottom:26px;background:#171717;color:#fff;border-radius:14px;padding:14px 18px;font-size:14.5px;display:flex;gap:12px;align-items:center;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.check{width:22px;height:22px;border-radius:50%;background:#10b981;display:grid;place-items:center}.check svg{width:13px;height:13px;stroke:#fff;stroke-width:3;fill:none}
.callout{position:absolute;background:#171717;color:#fff;border-radius:14px;padding:12px 16px;font-size:15px;font-weight:500;box-shadow:0 18px 50px rgba(0,0,0,.35)}
/* finanzas */
.stat{border:1px solid var(--bd);border-radius:12px;padding:14px 16px}.stat .t{font-size:13px;color:var(--mfg)}.stat .v{font-size:26px;font-weight:600;margin-top:4px;letter-spacing:-.02em}.stat .h{font-size:12px;color:var(--mfg);margin-top:3px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.cardh{font-size:15px;font-weight:600;padding:14px 16px 0}.cardb{padding:10px 16px 14px}
.leg{display:flex;gap:14px;font-size:12px;color:var(--mfg);margin-bottom:6px}.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.cap{font-size:12px;color:var(--mfg);margin-top:6px;line-height:1.35}
/* ticket */
.ticket{position:absolute;width:420px;background:#fffef8;color:#222;border-radius:6px;padding:34px 30px 40px;font-family:ui-monospace,Menlo,monospace;font-size:15px;box-shadow:0 30px 80px rgba(0,0,0,.6);line-height:1.55}
.ticket hr{border:0;border-top:1px dashed #bbb;margin:12px 0}.ticket .row{display:flex;justify-content:space-between}
.scan{position:absolute;left:-10px;right:-10px;height:3px;background:linear-gradient(90deg,transparent,#7dd3fc,transparent);box-shadow:0 0 28px 8px rgba(125,211,252,.55)}
.dlg{position:absolute;width:640px;background:#fff;color:var(--fg);border-radius:18px;padding:26px;box-shadow:0 40px 120px rgba(0,0,0,.55),0 0 0 1px rgba(0,0,0,.06)}
.dlg h3{font-size:20px;font-weight:600;letter-spacing:-.01em}.dlg .d{font-size:13.5px;color:var(--mfg);margin:6px 0 16px;line-height:1.4}
.fld{margin-bottom:11px}.fld label{display:block;font-size:12.5px;font-weight:500;margin-bottom:5px}.inp{height:38px;border:1px solid #d4d4d4;border-radius:9px;padding:0 12px;display:flex;align-items:center;font-size:14.5px;background:#fff}
.inp.fill{border-color:#10b981;box-shadow:0 0 0 3px rgba(16,185,129,.16)}
/* intro/outro */
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.bigword{font-family:"Inter Display","Inter",sans-serif;font-size:170px;font-weight:600;letter-spacing:-.045em;line-height:1}
.chipgrid{display:grid;grid-template-columns:repeat(3,300px);gap:16px;margin-top:56px}
.chip{display:flex;align-items:center;gap:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:20px 22px;font-size:25px;font-weight:500;text-align:left;backdrop-filter:blur(14px)}
.chip svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
</style></head>
<body><div id="stage"></div>
<script>
// ---------- utilidades ----------
const $=(h)=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstElementChild};
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), ease=(x)=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2}, easeOut=(x)=>1-Math.pow(1-clamp(x),3);
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const mxn=(v,d=0)=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN',minimumFractionDigits:d,maximumFractionDigits:d}).format(v);
const num=(v)=>new Intl.NumberFormat('es-MX').format(Math.round(v));
const LOGO=`<svg viewBox="342 281 342 462" fill="currentColor"><path d="M387.00 419.45L387.00 742.79L454.00 698.46L454.00 585.50L512.50 585.50L512.50 636.83L639.03 553.16L512.50 469.24L512.50 519.75L454.00 519.75L454.00 464.01ZM342.07 364.98L468.75 281.29L468.75 331.25L555.50 331.25A126.6 126.6 0 0 1 653.74 537.71L597.56 500.51A60.3 60.3 0 0 0 555.50 397.00L468.75 397.00L468.75 448.36Z"/></svg>`;
const IC={
 cart:'<path d="M3 3h2l2.4 12.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"/><circle cx="10" cy="21" r="1"/><circle cx="18" cy="21" r="1"/>',
 up:'<path d="M22 7l-8.5 8.5-5-5L2 17"/><path d="M16 7h6v6"/>',
 file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8"/>',
 bank:'<path d="M3 22h18M6 18v-7M10 18v-7M14 18v-7M18 18v-7M12 2l8 5H4z"/>',
 chart:'<path d="M3 3v18h18"/><path d="M19 9l-5 5-4-4-3 3"/>',
 people:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',
 card:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>',
 book:'<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2zM22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
 gear:'<circle cx="12" cy="12" r="3"/><path d="M12 1v3M12 20v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M1 12h3M20 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>'};
const svgi=(k)=>`<svg viewBox="0 0 24 24">${IC[k]}</svg>`;
const MODS=[['cart','Compras'],['up','Ventas'],['file','Facturas'],['bank','Conciliación bancaria'],['chart','Finanzas'],['people','Relaciones'],['card','Suscripción'],['book','Catálogo'],['gear','Administración']];
const badge=(t,k)=>`<span class="badge b-${k}">${t}</span>`;
function shell(active,tabs,tabOn,page){
  return `<div class="chrome"><i class="dot"></i><i class="dot"></i><i class="dot"></i><span class="url">procura-theta.vercel.app</span></div>
  <div class="app"><div class="side"><div class="logo">${LOGO}Procura</div>${MODS.map(([i,l])=>`<div class="mod ${l===active?'on':''}">${svgi(i)}${l}</div>`).join('')}</div>
  <div class="main"><div class="top"><span class="org"><span class="av">MS</span>Marea Studio, S.A. de C.V.</span><span>Notificaciones · Mi cuenta</span></div>
  ${tabs?`<div class="tabs">${tabs.map(t=>`<span class="tab ${t===tabOn?'on':''}">${t}</span>`).join('')}</div>`:''}
  <div class="page">${page}</div></div></div>`;
}
function scene(headHTML,winHTML,extra=''){
  const s=$(`<div class="scene">${headHTML}<div class="win">${winHTML}</div>${extra}</div>`);document.getElementById('stage').appendChild(s);return s;
}
const head=(e,t,s)=>`<div class="head"><div class="eyebrow">${e}</div><div class="title">${t}</div><div class="sub">${s}</div></div>`;

// ---------- datos de la demo (ficticios) ----------
const CONCEPTS=[['Laptop 14″ 16 GB / 512 GB',6,'pieza'],['Monitor 27″ QHD',6,'pieza'],['Docking station USB-C',6,'pieza']];
const QUOTES=[
 {s:'TecnoMex',n:'COT-0127',p:[18490,5290,2150],d:5,v:'30 oct 2026'},
 {s:'CompuNorte',n:'COT-0128',p:[17950,5490,1980],d:8,v:'02 nov 2026'},
 {s:'OfiPlus',n:'COT-0129',p:[19200,4980,2260],d:3,v:'28 oct 2026'}];
QUOTES.forEach(q=>{q.sub=q.p.reduce((a,p,i)=>a+p*CONCEPTS[i][1],0);q.iva=Math.round(q.sub*.16);q.tot=q.sub+q.iva});
const BEST=CONCEPTS.map((_,i)=>Math.min(...QUOTES.map(q=>q.p[i])));
const MONTHS=['may','jun','jul','ago','sep','oct'];
const SALES=[412,468,455,521,498,563].map(x=>x*1000),EXPS=[301,322,340,356,371,389].map(x=>x*1000),COLL=[380,431,440,489,470,508].map(x=>x*1000),PAID=[290,305,331,340,362,371].map(x=>x*1000);
const CATS=[['Proveedores',148000],['Servicios profesionales',86000],['Renta y oficina',54000],['Software y nube',41000],['Papelería',22000],['Otros',38000]];
const SUPS=[['CompuNorte',92000],['Renta Corporativo Reforma',54000],['Vercel / Supabase',31000],['Contadores Asociados',28000],['TecnoMex',24000]];
const PAL=['#10b981','#6366f1','#f59e0b','#ec4899','#06b6d4','#94a3b8'];

// ---------- escenas ----------
const S={};
// 0 intro
S.intro=$(`<div class="scene"><div class="center"><div id="lm" style="width:150px;color:#fff">${LOGO}</div><div class="bigword" id="lw" style="margin-top:34px">Procura</div><div id="ls" style="font-size:34px;color:#a1a1a6;margin-top:26px;letter-spacing:.01em">Compras, finanzas y facturación.</div></div></div>`);
// 1 statement
S.stmt=$(`<div class="scene"><div class="center"><div class="bigword" style="font-size:200px"><span id="w1">Compra.</span> <span id="w2" style="color:#9aa0ff">Factura.</span> <span id="w3" style="color:#7dd3fc">Concilia.</span></div><div id="w4" style="font-size:54px;font-weight:500;letter-spacing:-.02em;margin-top:44px;color:#d4d4d8">Todo en un solo lugar.</div></div></div>`);
document.getElementById('stage').append(S.intro,S.stmt);

// 2 cotizaciones
(function(){
 const th=QUOTES.map(q=>`<th class="r" style="min-width:230px"><div style="color:#0a0a0a;font-weight:600;font-size:15px">${q.s}</div><div class="mono xs mf">${q.n}</div></th>`).join('');
 const rows=CONCEPTS.map((c,i)=>`<tr><td><div style="font-weight:500">${c[0]}</div><div class="xs mf">${c[1]} ${c[2]}s</div></td>${QUOTES.map((q,j)=>`<td class="r tn q${i}${j}"><div class="pv">${mxn(q.p[i])}</div><div class="xs mf">${c[1]} pz · ${mxn(q.p[i]*c[1])}</div></td>`).join('')}</tr>`).join('');
 const page=`<div class="ph"><div><h2>Equipo de cómputo para oficina</h2><p>REQ-0042 · Marea Studio · Entrega requerida 15 nov 2026</p></div><div>${badge('Esperando ofertas','info')}</div></div>
 <div class="card" style="padding:16px 0 4px"><div style="display:flex;justify-content:space-between;padding:0 16px 10px"><b style="font-size:17px">Cotizaciones</b><span class="btn sm">Solicitar cotización</span></div>
 <div style="display:flex;gap:8px;padding:0 16px 12px">${QUOTES.map(q=>`<span class="pill"><span class="mono">RFQ-${q.n.slice(-4)}</span>${q.s}${badge('Enviada','info')}</span>`).join('')}</div>
 <table><thead><tr><th style="min-width:250px">Concepto</th>${th}</tr></thead><tbody>${rows}
 <tr style="border-top:2px solid #e5e5e5"><td class="mf">Impuestos (IVA 16%)</td>${QUOTES.map(q=>`<td class="r tn">${mxn(q.iva)}</td>`).join('')}</tr>
 <tr><td style="font-weight:600">Total</td>${QUOTES.map((q,j)=>`<td class="r tn tot${j}" style="font-size:19px;font-weight:600">${mxn(q.tot)}</td>`).join('')}</tr>
 <tr><td class="mf">Entrega</td>${QUOTES.map(q=>`<td class="r">${q.d} días</td>`).join('')}</tr>
 <tr><td class="mf">Vigencia</td>${QUOTES.map(q=>`<td class="r">${q.v}</td>`).join('')}</tr>
 <tr><td></td>${QUOTES.map((q,j)=>`<td class="r"><span class="btn sm ${j===1?'p':''} buy${j}">✓ Comprar esta</span> <span class="btn sm">✕ Rechazar</span></td>`).join('')}</tr></tbody></table>
 <p class="xs mf" style="padding:10px 16px 12px">Al elegir una cotización se crea la orden con esas líneas y precios. Los precios más bajos por concepto se resaltan; la decisión es tuya.</p></div>
 <div class="toast" id="tq" style="opacity:0"><span class="check"><svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg></span><span><b>Orden OC-0042 creada</b><br><span style="opacity:.7;font-size:13px">CompuNorte · ${mxn(QUOTES[1].tot)}</span></span></div>`;
 S.cot=scene(head('Compras','Cotiza. Compara. <span class="grad">Decide.</span>','Las ofertas de tus proveedores lado a lado, con el mejor precio de cada concepto resaltado.'),shell('Compras',['Gastos','Comprar','Requisiciones','Aprobaciones','Cotizaciones','Órdenes'],'Requisiciones',page),
 `<div class="callout" id="cq" style="left:1000px;top:1010px;opacity:0">Diferencia entre la más barata y la más cara: <b>${mxn(QUOTES[2].sub-QUOTES[1].sub)}</b> + IVA</div>`);
})();

// 3 facturas
(function(){
 const R=[['A-1042','14 oct 2026','Papelería El Sol, S.A.','Factura de egreso recibida',1284.5,'Vigente','ok'],['F-88231','13 oct 2026','CompuNorte, S.A. de C.V.','Factura de egreso recibida',152520*1.16,'Vigente','ok'],['2201','12 oct 2026','Renta Corporativo Reforma','Factura de egreso recibida',62640,'Vigente','ok'],['VS-7731','10 oct 2026','Vercel Inc.','Factura de egreso recibida',3480,'Vigente','ok'],['B-5509','09 oct 2026','Contadores Asociados','Factura de egreso recibida',32480,'Vigente','ok'],['T-3318','08 oct 2026','TecnoMex, S.A.','Factura de egreso recibida',27840,'Vigente','ok'],['0417','07 oct 2026','Servicios Gráficos del Valle','Factura de egreso recibida',9860,'Vigente','ok']];
 const uu=i=>['7C1E4A52','B93D0F6A','2F8A91D4','D40C77E1','51AB3C09','E6270D8B','9A4F12C7'][i]+'-4b1e-9c3a-5d2f-8e7a1c0b9d3'+i;
 const rows=R.map((r,i)=>`<tr class="fr" data-i="${i}"><td style="font-weight:500">${r[0]}<div class="mono xs mf">${uu(i)}</div></td><td>${r[1]}</td><td>${r[2]}</td><td class="mf">${r[3]}</td><td class="r tn">${mxn(r[4],2)}</td><td class="r tn">${mxn(r[4],2)}</td><td>${badge(r[5],r[6])}</td></tr>`).join('');
 const page=`<div class="ph"><div><h2>Facturas</h2><p>Comprobantes emitidos y recibidos, ligados a sus ventas y gastos.</p></div><div style="display:flex;gap:8px"><span class="btn">Cargar XML</span><span class="btn p">Emitir factura</span></div></div>
 <div class="card" style="padding:16px 18px;margin-bottom:14px;display:flex;align-items:center;gap:26px"><div style="flex:1"><div style="font-weight:600;font-size:16px">Descarga masiva del SAT</div><div class="xs mf" style="margin-top:4px">Sincronización activada · reglas de Recibidos y Emitidos · tus CFDI se importan sin duplicados.</div></div>
  <div style="text-align:right"><div class="tn" style="font-size:38px;font-weight:600;letter-spacing:-.03em" id="satn">0</div><div class="xs mf">CFDI recuperados del SAT</div></div><div style="text-align:right"><div class="tn" style="font-size:38px;font-weight:600;letter-spacing:-.03em;color:#047857">0</div><div class="xs mf">duplicados</div></div></div>
 <div class="card" style="overflow:hidden"><table><thead><tr><th>Folio</th><th>Fecha</th><th>Emisor</th><th>Tipo</th><th class="r">Total</th><th class="r">Por ligar</th><th>SAT</th></tr></thead><tbody>${rows}</tbody></table></div>`;
 S.fac=scene(head('Facturas','Tus facturas <span class="grad">llegan solas.</span>','Descarga masiva del SAT, emisión de CFDI y cada comprobante ligado a su venta o a su gasto.'),shell('Facturas',['Emitidas','Recibidas','Descarga masiva del SAT'],'Recibidas',page));
})();

// 4 gastos / OCR
